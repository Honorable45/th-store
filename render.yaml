# Blueprint Render — API NestJS + PostgreSQL managé.
# Les secrets (sync: false) sont à saisir dans le tableau de bord Render.
services:
  - type: web
    name: thstore-backend
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @thstore/backend build
    startCommand: pnpm --filter @thstore/backend start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thstore-db
          property: connectionString
      # URL du site (projet Vercel « frontend »), sans / final. Ex. https://thstore.vercel.app
      - key: WEB_ORIGIN
        sync: false
      # URL de l'administration (projet Vercel « admin »). Ex. https://thstore-admin.vercel.app
      - key: ADMIN_ORIGIN
        sync: false
      # URL de ce service Render. Ex. https://thstore-backend.onrender.com
      - key: API_PUBLIC_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      # openssl rand -base64 32 — à conserver dans un coffre : sans elle, les IMEI sont illisibles.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Les navigateurs passent par le relais /api de Vercel, puis par le proxy Render.
      - key: TRUST_PROXY
        value: "2"
      - key: STORAGE_DRIVER
        value: s3
      # Stockage des photos (Cloudflare R2 recommandé) : le disque Render est effacé à chaque déploiement.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      # Facultatif : laisser vide désactive le paiement mobile en ligne.
      - key: PAYGATE_API_KEY
        sync: false

databases:
  - name: thstore-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
