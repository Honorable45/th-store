# Blueprint Render — API NestJS + PostgreSQL managé.
# Les secrets (sync: false) sont à saisir dans le tableau de bord Render.
services:
  - type: web
    name: thstore-backend
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @thstore/backend build
    startCommand: pnpm --filter @thstore/backend start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thstore-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "2"
      - key: BUSINESS_TIMEZONE
        value: Africa/Lome
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: PAYGATE_API_KEY
        sync: false

databases:
  - name: thstore-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
